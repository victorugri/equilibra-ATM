<!-- O nome do app no lugar de "Início": a aba de baixo já diz onde a pessoa está. -->
<app-page-header title="Equilibra ATM" />
<div class="page">
  <section class="hero" aria-labelledby="greeting">
    <img
      class="decoration one"
      src="images/inicio-decoracao-1.svg"
      width="180"
      height="180"
      alt=""
    />
    <img
      class="decoration two"
      src="images/inicio-decoracao-2.svg"
      width="110"
      height="110"
      alt=""
    />
    <p class="weekday">{{ weekday }}</p>
    <h1 id="greeting">{{ greeting() }}</h1>
    <p class="subtitle">Veja como está o seu cuidado com a mandíbula.</p>
  </section>

  <app-daily-plan-card />

  <section class="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">Seu resumo</h2>
    <div class="grid">
      @for (item of indicators(); track item.tone) {
        <app-indicator
          [tone]="item.tone"
          [label]="item.label"
          [value]="item.value"
          [unit]="item.unit"
          [detail]="item.detail"
        />
      }
    </div>
  </section>
</div>
